name: Compilar APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ordenar archivos
        run: |
          mkdir -p app/src/main/java/com/venezuela/voz
          mv *.kt app/src/main/java/com/venezuela/voz/
          mv AndroidManifest.xml app/src/main/
          mv app_build.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VenezuelaVoz-APK
          path: app/build/outputs/apk/debug/app-debug.apk
